<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BriefLectures</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <!-- Shown while the bundled engine starts (about a second), or with ?error=… if it couldn't. -->
    <main>
      <img class="mark" src="icon.svg" alt="" width="96" height="96" />
      <h1>BriefLectures</h1>
      <p id="status" class="status">Starting…</p>
      <div id="spinner" class="spinner" aria-hidden="true"></div>
      <button id="restart" class="restart" hidden>Restart BriefLectures</button>
    </main>
    <script src="splash.js"></script>
  </body>
</html>
