[project]
name = "brieflectures-backend"
version = "0.4.0"
description = "Lecture analysis service: fetches YouTube transcripts and labels skippable segments with a local model."
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6,<1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "youtube-transcript-api>=1.2,<2",
    "httpx>=0.27",
    # Speech-to-text for lectures without captions (runs in the separate brief-transcribe process).
    "faster-whisper>=1.2,<2",
    "av>=16,<19",  # PyAV 19 dropped an argument faster-whisper 1.2 still passes when decoding audio
    "yt-dlp[default]>=2026.10",
    "deno>=2.5",  # JavaScript runtime yt-dlp needs for YouTube
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
