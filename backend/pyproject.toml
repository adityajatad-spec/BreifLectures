[project]
name = "brieflectures-backend"
version = "0.1.0"
description = "Lecture analysis service: fetches YouTube transcripts and labels skippable segments."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "youtube-transcript-api>=1.2,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
